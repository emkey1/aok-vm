  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7CF29C"/><stop offset="0.45" stop-color="#3DD6F5"/>
    <stop offset="0.8" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF6FD8"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
